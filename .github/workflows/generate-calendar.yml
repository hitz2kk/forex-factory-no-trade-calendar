name: Generate no-trade calendar

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/generate-calendar.yml
      - requirements.txt

permissions:
  contents: write

concurrency:
  group: no-trade-calendar
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install calendar browser
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test calendar updates
        run: python -m unittest discover -s tests -v

      - name: Generate no-trade calendar
        run: python scripts/generate_no_trade_calendar.py --include-next-week --output no-trade.ics

      - name: Commit updated calendar
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update no-trade calendar"
          file_pattern: no-trade.ics
